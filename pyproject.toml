[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "patcherex2"
dynamic = ["version"]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "angr",
    "pyelftools",
    "pypcode",
    "pydantic==2.13.5",
    "lief",
    "keystone-engine",
    "intelhex",
    "requests",
    "typing-extensions>=4.4; python_version < '3.12'"
]

[project.optional-dependencies]
ghidra = ["pyghidra>=3.0"]
ida = ["idapro>=0.0.10"]
all = ["patcherex2[ghidra]", "patcherex2[ida]"]

[project.urls]
"Homepage" = "https://github.com/purseclab/Patcherex2"
"Source" = "https://github.com/purseclab/Patcherex2"
"Tracker" = "https://github.com/purseclab/Patcherex2/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
exclude = ["examples"]

[tool.ruff.lint]
extend-select = ["I", "N", "UP", "B"]
ignore = ["RUF012"]

[tool.setuptools_scm]
# empty
